<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
         background: transparent; }
  /* ===== 宫格模式（主页大卡片） ===== */
  .fc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 760px) { .fc-grid { grid-template-columns: repeat(2, 1fr); } }
  .fc-card { background: #fff; border: 2px solid #2b2b2b; border-radius: 14px;
    padding: 14px 10px 12px; text-align: center; cursor: pointer; user-select: none;
    box-shadow: 3px 3px 0 rgba(43,43,43,.85); transition: all .12s; }
  .fc-card:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 rgba(43,43,43,.85); }
  .fc-card:active { transform: translate(1px,1px); box-shadow: 2px 2px 0 rgba(43,43,43,.85); }
  .fc-icon { width: 46px; height: 46px; margin: 0 auto 8px; border-radius: 12px;
    border: 2px solid #2b2b2b; display: flex; align-items: center; justify-content: center;
    font-size: 22px; }
  .fc-title { font-weight: 800; font-size: .95rem; color: #2b1d0e; }
  .fc-desc { font-size: .72rem; color: #8a6a3b; margin-top: 3px; line-height: 1.35; }
  /* ===== 导航条模式（每页顶部切换） ===== */
  .nb-bar { display: flex; gap: 8px; flex-wrap: wrap; }
  .nb-item { background: #fff; border: 2px solid #2b2b2b; border-radius: 999px;
    padding: 7px 16px; font-size: .85rem; font-weight: 700; color: #2b1d0e;
    cursor: pointer; user-select: none; box-shadow: 2px 2px 0 rgba(43,43,43,.5);
    transition: all .12s; white-space: nowrap; }
  .nb-item:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 rgba(43,43,43,.5); }
  .nb-item:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 rgba(43,43,43,.5); }
  .nb-item.active { color: #fff; background: var(--c); }
</style>
</head>
<body>
<div id="grid"></div>
<script>
function send(type, data) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data), "*");
}
// Streamlit 1.65+ 组件协议：componentReady 必须携带 apiVersion: 1（数字）
send("streamlit:componentReady", {apiVersion: 1});

function renderCards(cards, opts) {
  var layout = (opts && opts.layout) || "grid";
  var current = (opts && opts.current) || "";
  var box = document.getElementById("grid");
  box.className = layout === "bar" ? "nb-bar" : "fc-grid";
  box.style.maxWidth = "";
  box.style.margin = "";
  box.innerHTML = "";
  cards.forEach(function (c) {
    var d = document.createElement("div");
    if (layout === "bar") {
      d.className = "nb-item" + (c.key === current ? " active" : "");
      d.style.setProperty("--c", c.color);
      d.textContent = c.icon + " " + c.title;
    } else {
      d.className = "fc-card";
      d.innerHTML = '<div class="fc-icon" style="background:' + c.color + '">' + c.icon + '</div>' +
        '<div class="fc-title">' + c.title + '</div>' +
        '<div class="fc-desc">' + (c.desc || "") + '</div>';
    }
    d.onclick = function () {
      send("streamlit:setComponentValue", {value: {page: c.key}, dataType: "json"});
    };
    box.appendChild(d);
  });
  if (layout === "bar") { pinToTop(box); }
  send("streamlit:setFrameHeight", {height: document.body.scrollHeight + 8});
}

/* 导航条吸顶：把本组件 iframe 固定在视口顶部，主内容区留出对应高度 */
function pinToTop(box) {
  try {
    var fe = window.frameElement;
    if (!fe) return;
    fe.style.position = "fixed";
    fe.style.top = "0";
    fe.style.left = "0";                 /* 折叠按钮已移至左下角，顶部全宽 */
    fe.style.width = "100%";
    fe.style.zIndex = "999999";
    fe.style.background = "rgba(255,255,255,.92)";
    fe.style.backdropFilter = "blur(6px)";
    fe.style.borderBottom = "2px solid rgba(43,43,43,.8)";
    fe.style.boxSizing = "border-box";
    fe.style.padding = "7px 18px";
    box.style.maxWidth = "1100px";
    box.style.margin = "0 auto";
    var doc = window.parent.document;
    var main = doc.querySelector('[data-testid="stMainBlockContainer"]')
               || doc.querySelector('[data-testid="stMain"]')
               || doc.querySelector("section.main");
    if (main) { main.style.paddingTop = "56px"; }
    // 顺带把侧边栏收/展开按钮（stSidebarCollapseButton 展开态 / stExpandSidebarButton 折叠态）都移到左下角：
    // 内联样式最高优先级，避免与 Streamlit emotion 样式纠缠；隐藏右上角 Deploy 按钮
    ["stSidebarCollapseButton", "stExpandSidebarButton"].forEach(function (tid) {
      var btn = doc.querySelector('[data-testid="' + tid + '"]');
      if (btn) {
        btn.style.position = "fixed";
        btn.style.top = "auto";
        btn.style.right = "auto";
        btn.style.bottom = "14px";
        btn.style.left = "10px";
        btn.style.zIndex = "999999";
        btn.style.background = "#fff";
        btn.style.border = "2px solid #2b2b2b";
        btn.style.borderRadius = "10px";
        btn.style.boxShadow = "2px 2px 0 rgba(43,43,43,.5)";
      }
    });
    var dep = doc.querySelector('[data-testid="stAppDeployButton"]');
    if (dep) { dep.style.display = "none"; }
  } catch (e) { console.warn("pinToTop failed:", e); }
}

window.addEventListener("message", function (e) {
  if (e.data.type === "streamlit:render" && e.data.args) {
    renderCards(e.data.args.cards || [], e.data.args);
  }
});
</script>
</body>
</html>
