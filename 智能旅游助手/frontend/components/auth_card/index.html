<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: transparent;
    color: #333;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 18px 18px 26px; }

  /* ===== 顶部导航（绿底白字） ===== */
  .topnav { display: flex; align-items: center; justify-content: space-between;
    gap: 16px; }
  .brand { display: flex; align-items: center; gap: 8px; color: #fff;
    font-size: 1.12rem; font-weight: 700; }
  .brand .logo { width: 30px; height: 30px; border-radius: 8px; background: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 1rem; }
  .nav { display: flex; align-items: center; gap: 22px; }
  .nav a { color: #fff; font-size: .88rem; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px; opacity: .94; }
  .nav a:hover { opacity: 1; }
  .new { background: #ff9f43; color: #fff; font-size: .62rem; font-weight: 700;
    padding: 1px 5px; border-radius: 4px; line-height: 1.2; }
  .nav-login { background: #fff; color: #2DB88A; border: none; border-radius: 999px;
    padding: 7px 18px; font-size: .85rem; font-weight: 700; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  .nav-login:hover { background: #f2fbf8; }

  /* ===== 登录卡片 ===== */
  .card { margin-top: 22px; display: flex; background: #fff; border-radius: 16px;
    overflow: hidden; box-shadow: 0 12px 44px rgba(0,0,0,.10); min-height: 470px; }
  .left { width: 42%; background: #F5F7F7; padding: 34px 26px; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; }
  .left svg { width: 82%; max-width: 300px; height: auto; }
  .ltitle { margin-top: 22px; font-size: 1.12rem; font-weight: 700; color: #444; }
  .lsub { margin-top: 8px; font-size: .8rem; color: #999; }
  .dots { margin-top: 20px; display: flex; gap: 8px; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: #d8d8d8; }
  .dots span.on { background: #2DB88A; }

  .right { width: 58%; padding: 46px 46px 40px; display: flex; flex-direction: column;
    justify-content: center; }
  .rtitle { text-align: center; font-size: 1.5rem; font-weight: 700; color: #2b2b2b;
    margin-bottom: 30px; }
  .field { position: relative; margin-bottom: 16px; }
  .field .ficon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: #b6b6b6; display: flex; align-items: center;
    justify-content: center; }
  .field .ficon svg { width: 18px; height: 18px; }
  .field input { width: 100%; height: 46px; border: 1px solid #e2e2e2; border-radius: 8px;
    padding: 0 42px 0 42px; font-size: .94rem; color: #333; background: #fafafa;
    outline: none; transition: border-color .15s, background .15s; }
  .field input::placeholder { color: #bbb; }
  .field input:focus { border-color: #2DB88A; background: #fff;
    box-shadow: 0 0 0 3px rgba(45,184,138,.12); }
  .eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: #b6b6b6; padding: 0; }
  .eye svg { width: 19px; height: 19px; display: block; }
  .links { display: flex; justify-content: space-between; align-items: center;
    margin: 4px 0 20px; font-size: .82rem; }
  .link { color: #2DB88A; cursor: pointer; }
  .link:hover { text-decoration: underline; }
  .forgot { color: #999; }
  .submit { width: 100%; height: 46px; border: none; border-radius: 8px; background: #2DB88A;
    color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .15s; }
  .submit:hover { background: #26a57c; }
  .submit:active { background: #1f8f6a; }
  .orline { display: flex; align-items: center; gap: 14px; margin: 24px 0 18px;
    color: #aaa; font-size: .78rem; }
  .orline i { flex: 1; height: 1px; background: #eee; }
  .orline span { flex-shrink: 0; }
  .third { display: flex; justify-content: center; gap: 40px; }
  .tbtn { display: flex; flex-direction: column; align-items: center; gap: 7px;
    cursor: pointer; }
  .tbtn .circle { width: 48px; height: 48px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; }
  .tbtn .circle svg { width: 24px; height: 24px; }
  .tbtn span { font-size: .72rem; color: #999; }
  .c-wechat { background: #2DB88A; }
  .c-weibo { background: #E5573F; }
  .c-phone { background: #B7B7B7; }

  .errbox { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 8px;
    background: #FDEBEB; color: #d64545; font-size: .82rem; text-align: center; }

  /* toast */
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%)
    translateY(20px); background: rgba(43,43,43,.92); color: #fff; font-size: .82rem;
    padding: 9px 16px; border-radius: 8px; opacity: 0; pointer-events: none;
    transition: all .25s; z-index: 10; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 移动端 */
  @media (max-width: 720px) {
    .nav a { display: none; }
    .left { display: none; }
    .right { width: 100%; padding: 30px 22px 28px; }
    .card { min-height: 0; }
  }
</style>
</head>

<script>
function send(type, data) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data), "*");
}
send("streamlit:componentReady", {apiVersion: 1});

var $ = function (id) { return document.getElementById(id); };

function toast(msg) {
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.classList.remove("show"); }, 2400);
}

function showError(msg) {
  var e = $("errbox");
  if (!msg) { e.style.display = "none"; e.textContent = ""; return; }
  e.style.display = "block";
  e.textContent = msg;
}

function fit() {
  send("streamlit:setFrameHeight", {height: document.body.scrollHeight + 10});
}

function switchForm(mode) {
  $("loginForm").style.display = mode === "login" ? "block" : "none";
  $("registerForm").style.display = mode === "register" ? "block" : "none";
  $("rtitle").textContent = mode === "login" ? "欢迎来到旅游智能助手" : "加入旅游智能助手";
  showError("");
  fit();
}

function submit(mode) {
  var u = $(mode === "login" ? "user" : "reg_user").value.trim();
  var p = $(mode === "login" ? "pass" : "reg_pass").value;
  if (!u || !p) { showError("请输入用户名和密码"); return; }
  var p2 = "";
  if (mode === "register") {
    p2 = $("reg_pass2").value;
    if (p !== p2) { showError("两次输入的密码不一致"); return; }
  }
  showError("");
  send("streamlit:setComponentValue", {
    value: {mode: mode, username: u, password: p, password2: p2,
            nonce: Date.now().toString(36) + Math.random().toString(36).slice(2, 7)},
    dataType: "json"
  });
  // 提交后清空密码框，失败时也便于重试
  $(mode === "login" ? "pass" : "reg_pass").value = "";
  if (mode === "register") { $("reg_pass2").value = ""; }
}

$("btnSubmit").onclick = function () { submit("login"); };
$("btnRegister").onclick = function () { submit("register"); };
$("toRegister").onclick = function () { switchForm("register"); };
$("toLogin").onclick = function () { switchForm("login"); };

$("forgotPwd").onclick = function () {
  toast("如忘记密码，请联系管理员重置");
};

$("eyeBtn").onclick = function () {
  var p = $("pass");
  p.type = p.type === "password" ? "text" : "password";
};

var tbtns = document.querySelectorAll(".tbtn");
for (var i = 0; i < tbtns.length; i++) {
  tbtns[i].onclick = function () {
    toast((this.getAttribute("data-name") || "第三方登录") + "暂未接入，请使用账号密码登录");
  };
}

$("navLoginBtn").onclick = function () {
  $("user").focus();
  var c = document.querySelector(".card");
  if (c && c.scrollIntoView) { c.scrollIntoView({behavior: "smooth", block: "center"}); }
};

window.addEventListener("message", function (e) {
  if (e.data.type === "streamlit:render" && e.data.args) {
    var err = e.data.args.error || "";
    showError(err);
    fit();
  }
});

fit();
</script>
</body>
</html>
