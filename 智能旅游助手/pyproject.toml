[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-copilot"
version = "1.0.0"
description = "多 Agent 协作的 AI 旅行顾问：LangGraph 调度 + RAG 检索 + 流式输出"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DDAN11", email = "2512955620@qq.com" }]
keywords = ["fastapi", "langgraph", "multi-agent", "rag", "faiss", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
]

# 运行时依赖统一由 requirements.txt 管理（含版本上界约束），
# 这里只声明开发期工具，避免两处依赖版本打架。
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.setuptools]
# 只打包后端；frontend / knowledge_base / scripts 由 Dockerfile 直接 COPY
[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [
    ".venv", "data", "deploy", "frontend", "hf_cache",
    "knowledge_base", ".tools", ".backup",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff 自有规则
]
ignore = [
    "E501",  # 行宽交给 formatter，不在 lint 阶段卡
    "B008",  # FastAPI 的 Depends() 就是写在默认参数位置，属正常用法
    # 中文项目：RUF001/002/003 会把「：」「，」这类全角标点判为「歧义字符」，
    # 在这个代码库里是刻意用法，不是缺陷。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 脚本按顺序执行、需要在 sys.path 调整后再 import，E402 不适用
"scripts/*" = ["E402"]
"tests/*" = ["E402"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: 需要加载向量模型或真实网络的用例（默认仍会跑，可用 -m 'not slow' 跳过）",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["app"]
omit = [
    "app/agents/prompts.py",  # 纯提示词常量
    "app/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
